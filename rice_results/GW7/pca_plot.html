<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PCA - Haplotype Principal Component Analysis</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white;
                  padding: 20px 30px; border-radius: 10px 10px 0 0; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header-info { display: flex; gap: 25px; font-size: 13px; opacity: 0.9; }
        .controls { background: #fafafa; padding: 15px 20px; border-bottom: 1px solid #e0e0e0;
                    display: flex; gap: 20px; align-items: center; }
        .controls label { font-size: 13px; color: #555; }
        .controls select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; }
        .plot-container { padding: 30px; display: flex; gap: 30px; }
        #pca-plot { flex: 1; height: 500px; }
        .legend { width: 200px; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .legend h4 { margin-bottom: 15px; font-size: 14px; color: #333; }
        .legend-item { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 12px; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .axis text { font-size: 11px; }
        .axis-label { font-size: 13px; font-weight: 600; fill: #333; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Principal Component Analysis (PCA)</h1>
        <div class="header-info">
            <span>Samples: 27</span>
            <span>Haplotypes: 14</span>
            <span>PC1: 42.1% var</span>
            <span>PC2: 19.9% var</span>
            <span>PC3: 9.9% var</span>
        </div>
    </div>
    
    <div class="controls">
        <label>X-axis:</label>
        <select id="xAxis" onchange="updatePlot()">
            <option value="pc1" selected>PC1 (42.1%)</option>
            <option value="pc2">PC2 (19.9%)</option>
            <option value="pc3">PC3 (9.9%)</option>
        </select>
        <label>Y-axis:</label>
        <select id="yAxis" onchange="updatePlot()">
            <option value="pc1">PC1 (42.1%)</option>
            <option value="pc2" selected>PC2 (19.9%)</option>
            <option value="pc3">PC3 (9.9%)</option>
        </select>
        <label>Color by:</label>
        <select id="colorBy" onchange="updateColors()">
            <option value="haplotype" selected>Haplotype</option>
            <option value="phenotype">Phenotype</option>
            
        </select>
    </div>
    
    <div class="plot-container">
        <div id="pca-plot"></div>
        <div class="legend" id="legend">
            <h4>Haplotypes</h4>
        </div>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"id": "C005", "haplotype": "Hap5", "pc1": -36.88999376024132, "pc2": 6.433635964291779, "pc3": -4.139140708027225, "color": "#FF7F00", "phenotype": 102.0}, {"id": "C047", "haplotype": "Hap1", "pc1": 10.709012633290843, "pc2": 9.728918039856302, "pc3": -0.5892945550124233, "color": "#4DAF4A", "phenotype": 97.0}, {"id": "C101", "haplotype": "Hap3", "pc1": 9.0447147679501, "pc2": 3.386598089929415, "pc3": -0.47841402655881815, "color": "#E41A1C", "phenotype": 110.0}, {"id": "C106", "haplotype": "Hap3", "pc1": 9.0447147679501, "pc2": 3.3865980899294144, "pc3": -0.4784140265588237, "color": "#E41A1C", "phenotype": 107.0}, {"id": "C109", "haplotype": "Hap1", "pc1": 10.709012633290845, "pc2": 9.728918039856296, "pc3": -0.5892945550124209, "color": "#4DAF4A", "phenotype": 88.0}, {"id": "C119", "haplotype": "Hap2", "pc1": 3.680963703052379, "pc2": -18.352600118242705, "pc3": -5.017504274061054, "color": "#FFFF33", "phenotype": 88.0}, {"id": "C131", "haplotype": "Hap1", "pc1": 10.709012633290845, "pc2": 9.728918039856296, "pc3": -0.5892945550124208, "color": "#4DAF4A", "phenotype": 84.0}, {"id": "C152", "haplotype": "Hap2", "pc1": 3.680963703052379, "pc2": -18.352600118242705, "pc3": -5.017504274061054, "color": "#FFFF33", "phenotype": 94.0}, {"id": "C173", "haplotype": "Hap1", "pc1": 10.709012633290845, "pc2": 9.728918039856296, "pc3": -0.589294555012421, "color": "#4DAF4A", "phenotype": 89.0}, {"id": "C197", "haplotype": "Hap6", "pc1": 8.662066327059202, "pc2": 4.2454038855735226, "pc3": -1.059855563566808, "color": "#377EB8", "phenotype": 89.0}, {"id": "C199", "haplotype": "Hap7", "pc1": -1.8418428625314383, "pc2": -5.49689086804113, "pc3": 6.314019422599512, "color": "#984EA3", "phenotype": 104.0}, {"id": "C202", "haplotype": "Hap1", "pc1": 10.709012633290845, "pc2": 9.728918039856296, "pc3": -0.589294555012421, "color": "#4DAF4A", "phenotype": 89.0}, {"id": "W001", "haplotype": "Hap1", "pc1": 10.709012633290845, "pc2": 9.728918039856296, "pc3": -0.589294555012421, "color": "#4DAF4A", "phenotype": 87.0}, {"id": "W039", "haplotype": "Hap1", "pc1": 10.709012633290845, "pc2": 9.728918039856296, "pc3": -0.589294555012421, "color": "#4DAF4A", "phenotype": 91.0}, {"id": "W040", "haplotype": "Hap8", "pc1": -35.83084223339378, "pc2": 6.8054856043246605, "pc3": -4.988593539320525, "color": "#A65628", "phenotype": 109.0}, {"id": "W068", "haplotype": "Hap9", "pc1": -2.103203283482854, "pc2": -7.32713220386917, "pc3": 7.0422864588941065, "color": "#F781BF", "phenotype": 90.0}, {"id": "W138", "haplotype": "Hap1", "pc1": 10.709012633290845, "pc2": 9.728918039856296, "pc3": -0.589294555012421, "color": "#4DAF4A", "phenotype": 79.0}, {"id": "W151", "haplotype": "Hap4", "pc1": 4.866944809173785, "pc2": -16.317301773101804, "pc3": -4.352712082588276, "color": "#984EA3", "phenotype": 81.0}, {"id": "W160", "haplotype": "Hap2", "pc1": 3.680963703052379, "pc2": -18.352600118242705, "pc3": -5.017504274061054, "color": "#FFFF33", "phenotype": 89.0}, {"id": "W191", "haplotype": "Hap10", "pc1": -36.89828807869523, "pc2": 6.291735901287414, "pc3": -4.203748665830331, "color": "#377EB8", "phenotype": 114.0}, {"id": "W192", "haplotype": "Hap11", "pc1": -32.476410433339694, "pc2": 3.267607768725876, "pc3": -2.2568368968035997, "color": "#E41A1C", "phenotype": 112.0}, {"id": "W198", "haplotype": "Hap1", "pc1": 10.709012633290845, "pc2": 9.728918039856296, "pc3": -0.589294555012421, "color": "#4DAF4A", "phenotype": 108.0}, {"id": "W204", "haplotype": "Hap1", "pc1": 10.709012633290845, "pc2": 9.728918039856296, "pc3": -0.589294555012421, "color": "#4DAF4A", "phenotype": 93.0}, {"id": "W207", "haplotype": "Hap12", "pc1": -2.851833778489358, "pc2": -6.745247754911723, "pc3": 2.171487622360295, "color": "#FFFF33", "phenotype": 99.0}, {"id": "W217", "haplotype": "Hap13", "pc1": -9.34988281572643, "pc2": -6.373353517946872, "pc3": 35.72361639752643, "color": "#4DAF4A", "phenotype": 114.0}, {"id": "W219", "haplotype": "Hap14", "pc1": 3.6238943225275744, "pc2": -17.47121745692443, "pc3": -3.9955239372302653, "color": "#FF7F00", "phenotype": 87.0}, {"id": "W305", "haplotype": "Hap4", "pc1": 4.866944809173786, "pc2": -16.317301773101796, "pc3": -4.352712082588278, "color": "#984EA3", "phenotype": 82.0}];
const hapColors = {"Hap11": "#E41A1C", "Hap6": "#377EB8", "Hap1": "#4DAF4A", "Hap7": "#984EA3", "Hap5": "#FF7F00", "Hap2": "#FFFF33", "Hap8": "#A65628", "Hap9": "#F781BF", "Hap3": "#E41A1C", "Hap10": "#377EB8", "Hap13": "#4DAF4A", "Hap4": "#984EA3", "Hap14": "#FF7F00", "Hap12": "#FFFF33"};
const varExplained = [42.13908440165214, 19.917787892593676, 9.944538744486488];

const margin = {top: 30, right: 30, bottom: 60, left: 70};
const container = document.getElementById('pca-plot');
const width = container.clientWidth - margin.left - margin.right;
const height = 500 - margin.top - margin.bottom;

const svg = d3.select('#pca-plot')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

let xAxis, yAxis, xScale, yScale;

function updatePlot() {
    const xKey = document.getElementById('xAxis').value;
    const yKey = document.getElementById('yAxis').value;
    
    const xValues = data.map(d => d[xKey]);
    const yValues = data.map(d => d[yKey]);
    
    const xPad = (Math.max(...xValues) - Math.min(...xValues)) * 0.1;
    const yPad = (Math.max(...yValues) - Math.min(...yValues)) * 0.1;
    
    xScale = d3.scaleLinear()
        .domain([Math.min(...xValues) - xPad, Math.max(...xValues) + xPad])
        .range([0, width]);
    
    yScale = d3.scaleLinear()
        .domain([Math.min(...yValues) - yPad, Math.max(...yValues) + yPad])
        .range([height, 0]);
    
    svg.selectAll('.axis').remove();
    svg.selectAll('.axis-label').remove();
    
    svg.append('g')
        .attr('class', 'axis')
        .attr('transform', `translate(0,${height})`)
        .call(d3.axisBottom(xScale));
    
    svg.append('g')
        .attr('class', 'axis')
        .call(d3.axisLeft(yScale));
    
    const xLabel = xKey.toUpperCase() + ` (${varExplained[parseInt(xKey.slice(2))-1].toFixed(1)}%)`;
    const yLabel = yKey.toUpperCase() + ` (${varExplained[parseInt(yKey.slice(2))-1].toFixed(1)}%)`;
    
    svg.append('text')
        .attr('class', 'axis-label')
        .attr('x', width / 2)
        .attr('y', height + 45)
        .attr('text-anchor', 'middle')
        .text(xLabel);
    
    svg.append('text')
        .attr('class', 'axis-label')
        .attr('transform', 'rotate(-90)')
        .attr('x', -height / 2)
        .attr('y', -50)
        .attr('text-anchor', 'middle')
        .text(yLabel);
    
    svg.selectAll('circle')
        .data(data)
        .join('circle')
        .transition().duration(500)
        .attr('cx', d => xScale(d[xKey]))
        .attr('cy', d => yScale(d[yKey]));
}

function updateColors() {
    const colorBy = document.getElementById('colorBy').value;
    
    svg.selectAll('circle')
        .transition().duration(300)
        .attr('fill', d => {
            if (colorBy === 'phenotype' && d.phenotype !== undefined) {
                const min = Math.min(...data.filter(x => x.phenotype !== undefined).map(x => x.phenotype));
                const max = Math.max(...data.filter(x => x.phenotype !== undefined).map(x => x.phenotype));
                const norm = (d.phenotype - min) / (max - min);
                return d3.interpolateRdBu(1 - norm);
            }
            return d.color;
        });
    
    updateLegend(colorBy);
}

function updateLegend(colorBy) {
    const legend = document.getElementById('legend');
    legend.innerHTML = '<h4>' + (colorBy === 'haplotype' ? 'Haplotypes' : colorBy === 'phenotype' ? 'Phenotype' : 'Groups') + '</h4>';
    
    if (colorBy === 'haplotype') {
        Object.entries(hapColors).forEach(([hap, color]) => {
            const count = data.filter(d => d.haplotype === hap).length;
            legend.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${color};"></div>${hap} (n=${count})</div>`;
        });
    } else if (colorBy === 'phenotype') {
        legend.innerHTML += '<div style="height:150px;width:20px;background:linear-gradient(to bottom, #b2182b, #f7f7f7, #2166ac);margin:10px auto;"></div>';
        legend.innerHTML += '<div style="text-align:center;font-size:11px;">High → Low</div>';
    }
}

// 初始化
const tooltip = d3.select('#tooltip');

svg.selectAll('circle')
    .data(data)
    .enter()
    .append('circle')
    .attr('r', 6)
    .attr('fill', d => d.color)
    .attr('stroke', '#fff')
    .attr('stroke-width', 1)
    .attr('opacity', 0.8)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', 9).attr('stroke-width', 2);
        let html = `<strong>${d.id}</strong><br>Haplotype: ${d.haplotype}`;
        if (d.phenotype !== undefined) html += `<br>Phenotype: ${d.phenotype.toFixed(2)}`;
        if (d.group) html += `<br>Group: ${d.group}`;
        tooltip.style('display', 'block').html(html);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px').style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function() {
        d3.select(this).attr('r', 6).attr('stroke-width', 1);
        tooltip.style('display', 'none');
    });

updatePlot();
updateLegend('haplotype');
</script>
</body>
</html>
