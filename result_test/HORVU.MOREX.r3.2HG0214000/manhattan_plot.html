<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manhattan Plot - Region chr2H:655,368,607-655,371,656</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white;
                  padding: 20px 30px; border-radius: 10px 10px 0 0; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header-info { font-size: 13px; opacity: 0.9; }
        .plot-container { padding: 30px; }
        #manhattan { width: 100%; height: 450px; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .axis text { font-size: 11px; }
        .axis-label { font-size: 13px; font-weight: 600; }
        .threshold-line { stroke-dasharray: 5,5; }
        .legend { display: flex; gap: 20px; padding: 15px 30px; border-top: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Manhattan Plot</h1>
        <div class="header-info">Region: chr2H:655,368,607 - 655,371,656 | Variants: 41</div>
    </div>
    
    <div class="plot-container">
        <div id="manhattan"></div>
    </div>
    
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#3498db;"></div>Variants</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e74c3c;"></div>P &lt; 0.05</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8B0000;"></div>P &lt; 0.01</div>
        <div class="legend-item"><span style="color:#e74c3c;">---</span> P = 0.05</div>
        <div class="legend-item"><span style="color:#8B0000;">---</span> P = 0.01</div>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"pos": 655368675, "pvalue": 0.44358833173390066, "logp": 0.353019886170821, "type": "variant"}, {"pos": 655368709, "pvalue": 1.0090084005489984e-05, "logp": 4.9961052180079975, "type": "variant"}, {"pos": 655368814, "pvalue": 0.04415226848817252, "logp": 1.35504697800745, "type": "variant"}, {"pos": 655368836, "pvalue": 0.1174184148582433, "logp": 0.9302637868689732, "type": "variant"}, {"pos": 655369021, "pvalue": 0.12261547798265808, "logp": 0.911454704547, "type": "variant"}, {"pos": 655369040, "pvalue": 0.44358833173390066, "logp": 0.353019886170821, "type": "variant"}, {"pos": 655369187, "pvalue": 0.0015774843967693974, "logp": 2.802034927760826, "type": "variant"}, {"pos": 655369200, "pvalue": 0.7228101524082523, "logp": 0.1409757560780163, "type": "variant"}, {"pos": 655369245, "pvalue": 0.36454285078761073, "logp": 0.43825141448784916, "type": "variant"}, {"pos": 655369311, "pvalue": 0.8933429696335262, "logp": 0.048981776023603076, "type": "variant"}, {"pos": 655369446, "pvalue": 0.35530858474809024, "logp": 0.44939429922701546, "type": "variant"}, {"pos": 655369484, "pvalue": 0.3289350509238358, "logp": 0.48288984615329195, "type": "variant"}, {"pos": 655370128, "pvalue": 0.44358833173390066, "logp": 0.353019886170821, "type": "variant"}, {"pos": 655370157, "pvalue": 0.004208136943915416, "logp": 2.3759101355322962, "type": "variant"}, {"pos": 655370272, "pvalue": 0.0027438072463835356, "logp": 2.561646401264238, "type": "variant"}, {"pos": 655370276, "pvalue": 0.03831446985710718, "logp": 1.4166371792349426, "type": "variant"}, {"pos": 655370291, "pvalue": 0.03831446985710718, "logp": 1.4166371792349426, "type": "variant"}, {"pos": 655370311, "pvalue": 2.2977425293150205e-06, "logp": 5.638698637250137, "type": "variant"}, {"pos": 655370315, "pvalue": 0.008269632816747637, "logp": 2.082513773301207, "type": "variant"}, {"pos": 655370364, "pvalue": 0.14699544361957476, "logp": 0.8326961267589271, "type": "variant"}, {"pos": 655370379, "pvalue": 0.592781873821272, "logp": 0.2271050847516626, "type": "variant"}, {"pos": 655370426, "pvalue": 0.24657140793036816, "logp": 0.6080572849908558, "type": "variant"}, {"pos": 655370444, "pvalue": 0.00010393943733705718, "logp": 3.9832196385048144, "type": "variant"}, {"pos": 655370476, "pvalue": 0.6662335635148078, "logp": 0.17637349220608195, "type": "variant"}, {"pos": 655370499, "pvalue": 0.592781873821272, "logp": 0.2271050847516626, "type": "variant"}, {"pos": 655370514, "pvalue": 0.023261758910658473, "logp": 1.6333574496973269, "type": "variant"}, {"pos": 655370637, "pvalue": 0.0035276088997249965, "logp": 2.452519570395831, "type": "variant"}, {"pos": 655370649, "pvalue": 0.6662335635148078, "logp": 0.17637349220608195, "type": "variant"}, {"pos": 655370691, "pvalue": 0.14826352134467013, "logp": 0.8289656893458156, "type": "variant"}, {"pos": 655370718, "pvalue": 0.07675724653971445, "logp": 1.1148806128065007, "type": "variant"}, {"pos": 655370891, "pvalue": 0.007690575478318007, "logp": 2.1140411611469654, "type": "variant"}, {"pos": 655370947, "pvalue": 0.22106612191828887, "logp": 0.6554778073591673, "type": "variant"}, {"pos": 655370968, "pvalue": 0.007434239332498912, "logp": 2.1287634616542688, "type": "variant"}, {"pos": 655371046, "pvalue": 0.09494565135430516, "logp": 1.0225249217756047, "type": "variant"}, {"pos": 655371132, "pvalue": 8.20229274985446e-05, "logp": 4.086064734270985, "type": "variant"}, {"pos": 655371212, "pvalue": 1.3765636760526266e-05, "logp": 4.861203694536781, "type": "variant"}, {"pos": 655371233, "pvalue": 1.3765636760526266e-05, "logp": 4.861203694536781, "type": "variant"}, {"pos": 655371308, "pvalue": 1.3765636760526266e-05, "logp": 4.861203694536781, "type": "variant"}, {"pos": 655371316, "pvalue": 1.30063060946982e-05, "logp": 4.885846029378245, "type": "variant"}, {"pos": 655371367, "pvalue": 0.0028665266878355744, "logp": 2.54264401051733, "type": "variant"}, {"pos": 655371402, "pvalue": 0.5873904374676713, "logp": 0.2310731279337967, "type": "variant"}];
const margin = {top: 30, right: 40, bottom: 60, left: 70};
const container = document.getElementById('manhattan');
const width = container.clientWidth - margin.left - margin.right;
const height = 450 - margin.top - margin.bottom;

const svg = d3.select('#manhattan')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

// 比例尺
const xScale = d3.scaleLinear()
    .domain([655368607, 655371656])
    .range([0, width]);

const maxLogP = data.length > 0 ? Math.max(...data.map(d => d.logp)) * 1.1 : 5;
const yScale = d3.scaleLinear()
    .domain([0, Math.max(maxLogP, 3)])
    .range([height, 0]);

// 坐标轴
svg.append('g')
    .attr('transform', `translate(0,${height})`)
    .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => (d/1000000).toFixed(2) + 'M'));

svg.append('g')
    .call(d3.axisLeft(yScale));

// 坐标轴标签
svg.append('text')
    .attr('class', 'axis-label')
    .attr('x', width / 2)
    .attr('y', height + 45)
    .attr('text-anchor', 'middle')
    .text('Position (Mb)');

svg.append('text')
    .attr('class', 'axis-label')
    .attr('transform', 'rotate(-90)')
    .attr('x', -height / 2)
    .attr('y', -50)
    .attr('text-anchor', 'middle')
    .text('-log10(P-value)');

// 阈值线
const thresholds = [
    {value: -Math.log10(0.05), color: '#e74c3c', label: 'P=0.05'},
    {value: -Math.log10(0.01), color: '#8B0000', label: 'P=0.01'}
];

thresholds.forEach(t => {
    if (t.value <= maxLogP) {
        svg.append('line')
            .attr('class', 'threshold-line')
            .attr('x1', 0)
            .attr('x2', width)
            .attr('y1', yScale(t.value))
            .attr('y2', yScale(t.value))
            .attr('stroke', t.color)
            .attr('stroke-width', 1.5);
    }
});

// 绘制点
const tooltip = d3.select('#tooltip');

svg.selectAll('circle')
    .data(data)
    .enter()
    .append('circle')
    .attr('cx', d => xScale(d.pos))
    .attr('cy', d => yScale(d.logp))
    .attr('r', 5)
    .attr('fill', d => {
        if (d.pvalue < 0.01) return '#8B0000';
        if (d.pvalue < 0.05) return '#e74c3c';
        return '#3498db';
    })
    .attr('opacity', 0.7)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', 8).attr('opacity', 1);
        tooltip.style('display', 'block')
            .html(`<strong>Position:</strong> ${d.pos.toLocaleString()}<br>
                   <strong>P-value:</strong> ${d.pvalue.toExponential(2)}<br>
                   <strong>-log10(P):</strong> ${d.logp.toFixed(2)}`);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px')
               .style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function() {
        d3.select(this).attr('r', 5).attr('opacity', 0.7);
        tooltip.style('display', 'none');
    });
</script>
</body>
</html>
