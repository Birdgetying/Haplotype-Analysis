<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manhattan Plot - Region chr5H:476,225,989-476,228,586</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white;
                  padding: 20px 30px; border-radius: 10px 10px 0 0; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header-info { font-size: 13px; opacity: 0.9; }
        .plot-container { padding: 30px; }
        #manhattan { width: 100%; height: 450px; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .axis text { font-size: 11px; }
        .axis-label { font-size: 13px; font-weight: 600; }
        .threshold-line { stroke-dasharray: 5,5; }
        .legend { display: flex; gap: 20px; padding: 15px 30px; border-top: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Manhattan Plot</h1>
        <div class="header-info">Region: chr5H:476,225,989 - 476,228,586 | Variants: 23</div>
    </div>
    
    <div class="plot-container">
        <div id="manhattan"></div>
    </div>
    
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#3498db;"></div>Variants</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e74c3c;"></div>P &lt; 0.05</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8B0000;"></div>P &lt; 0.01</div>
        <div class="legend-item"><span style="color:#e74c3c;">---</span> P = 0.05</div>
        <div class="legend-item"><span style="color:#8B0000;">---</span> P = 0.01</div>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"pos": 476226210, "pvalue": 0.2754934880362793, "logp": 0.5598886623052438, "type": "variant"}, {"pos": 476226298, "pvalue": 0.01997629141578154, "logp": 1.6994851350868887, "type": "variant"}, {"pos": 476226299, "pvalue": 0.2010556657351139, "logp": 0.6966836839993897, "type": "variant"}, {"pos": 476226419, "pvalue": 0.8243403749379956, "logp": 0.08389342855207267, "type": "variant"}, {"pos": 476226582, "pvalue": 0.01997629141578154, "logp": 1.6994851350868887, "type": "variant"}, {"pos": 476226810, "pvalue": 0.2318048544966932, "logp": 0.6348774732082721, "type": "variant"}, {"pos": 476227119, "pvalue": 0.3832962729815154, "logp": 0.4164654036296322, "type": "variant"}, {"pos": 476227321, "pvalue": 1.9774413073671924e-05, "logp": 4.7038963979768535, "type": "variant"}, {"pos": 476227388, "pvalue": 0.6473539376406832, "logp": 0.18885820598406483, "type": "variant"}, {"pos": 476227523, "pvalue": 0.8710425827072134, "logp": 0.05996061309484529, "type": "variant"}, {"pos": 476227640, "pvalue": 0.4844950284931546, "logp": 0.3147106749786795, "type": "variant"}, {"pos": 476227734, "pvalue": 0.9347860847384366, "logp": 0.02928776115603189, "type": "variant"}, {"pos": 476227735, "pvalue": 0.0068865313988090895, "logp": 2.1619994680289567, "type": "variant"}, {"pos": 476227771, "pvalue": 0.7870123854237142, "logp": 0.10401843297911824, "type": "variant"}, {"pos": 476227808, "pvalue": 0.0003432541312064171, "logp": 3.4643842271448015, "type": "variant"}, {"pos": 476227810, "pvalue": 0.9129681349297543, "logp": 0.03954438025943235, "type": "variant"}, {"pos": 476227836, "pvalue": 0.1318009971555132, "logp": 0.8800813040250226, "type": "variant"}, {"pos": 476227866, "pvalue": 8.005108690462812e-05, "logp": 4.096632767011668, "type": "variant"}, {"pos": 476227968, "pvalue": 0.08243135686065657, "logp": 1.083907551396793, "type": "variant"}, {"pos": 476227983, "pvalue": 0.12869807789187326, "logp": 0.8904279392431395, "type": "variant"}, {"pos": 476227990, "pvalue": 0.35944555055000627, "logp": 0.444366887997751, "type": "variant"}, {"pos": 476228369, "pvalue": 0.02560216490517332, "logp": 1.5917233094296417, "type": "variant"}, {"pos": 476228524, "pvalue": 0.04367165193542379, "logp": 1.3598003800303415, "type": "variant"}];
const margin = {top: 30, right: 40, bottom: 60, left: 70};
const container = document.getElementById('manhattan');
const width = container.clientWidth - margin.left - margin.right;
const height = 450 - margin.top - margin.bottom;

const svg = d3.select('#manhattan')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

// 比例尺
const xScale = d3.scaleLinear()
    .domain([476225989, 476228586])
    .range([0, width]);

const maxLogP = data.length > 0 ? Math.max(...data.map(d => d.logp)) * 1.1 : 5;
const yScale = d3.scaleLinear()
    .domain([0, Math.max(maxLogP, 3)])
    .range([height, 0]);

// 坐标轴
svg.append('g')
    .attr('transform', `translate(0,${height})`)
    .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => (d/1000000).toFixed(2) + 'M'));

svg.append('g')
    .call(d3.axisLeft(yScale));

// 坐标轴标签
svg.append('text')
    .attr('class', 'axis-label')
    .attr('x', width / 2)
    .attr('y', height + 45)
    .attr('text-anchor', 'middle')
    .text('Position (Mb)');

svg.append('text')
    .attr('class', 'axis-label')
    .attr('transform', 'rotate(-90)')
    .attr('x', -height / 2)
    .attr('y', -50)
    .attr('text-anchor', 'middle')
    .text('-log10(P-value)');

// 阈值线
const thresholds = [
    {value: -Math.log10(0.05), color: '#e74c3c', label: 'P=0.05'},
    {value: -Math.log10(0.01), color: '#8B0000', label: 'P=0.01'}
];

thresholds.forEach(t => {
    if (t.value <= maxLogP) {
        svg.append('line')
            .attr('class', 'threshold-line')
            .attr('x1', 0)
            .attr('x2', width)
            .attr('y1', yScale(t.value))
            .attr('y2', yScale(t.value))
            .attr('stroke', t.color)
            .attr('stroke-width', 1.5);
    }
});

// 绘制点
const tooltip = d3.select('#tooltip');

svg.selectAll('circle')
    .data(data)
    .enter()
    .append('circle')
    .attr('cx', d => xScale(d.pos))
    .attr('cy', d => yScale(d.logp))
    .attr('r', 5)
    .attr('fill', d => {
        if (d.pvalue < 0.01) return '#8B0000';
        if (d.pvalue < 0.05) return '#e74c3c';
        return '#3498db';
    })
    .attr('opacity', 0.7)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', 8).attr('opacity', 1);
        tooltip.style('display', 'block')
            .html(`<strong>Position:</strong> ${d.pos.toLocaleString()}<br>
                   <strong>P-value:</strong> ${d.pvalue.toExponential(2)}<br>
                   <strong>-log10(P):</strong> ${d.logp.toFixed(2)}`);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px')
               .style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function() {
        d3.select(this).attr('r', 5).attr('opacity', 0.7);
        tooltip.style('display', 'none');
    });
</script>
</body>
</html>
