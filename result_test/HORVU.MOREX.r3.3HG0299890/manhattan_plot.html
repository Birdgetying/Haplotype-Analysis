<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manhattan Plot - Region chr3H:539,101,555-539,105,112</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white;
                  padding: 20px 30px; border-radius: 10px 10px 0 0; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header-info { font-size: 13px; opacity: 0.9; }
        .plot-container { padding: 30px; }
        #manhattan { width: 100%; height: 450px; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .axis text { font-size: 11px; }
        .axis-label { font-size: 13px; font-weight: 600; }
        .threshold-line { stroke-dasharray: 5,5; }
        .legend { display: flex; gap: 20px; padding: 15px 30px; border-top: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Manhattan Plot</h1>
        <div class="header-info">Region: chr3H:539,101,555 - 539,105,112 | Variants: 43</div>
    </div>
    
    <div class="plot-container">
        <div id="manhattan"></div>
    </div>
    
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#3498db;"></div>Variants</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e74c3c;"></div>P &lt; 0.05</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8B0000;"></div>P &lt; 0.01</div>
        <div class="legend-item"><span style="color:#e74c3c;">---</span> P = 0.05</div>
        <div class="legend-item"><span style="color:#8B0000;">---</span> P = 0.01</div>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"pos": 539102010, "pvalue": 0.3879361989345673, "logp": 0.4112396938105259, "type": "variant"}, {"pos": 539102154, "pvalue": 0.013547760062796031, "logp": 1.8681325035188767, "type": "variant"}, {"pos": 539102193, "pvalue": 0.3879361989345673, "logp": 0.4112396938105259, "type": "variant"}, {"pos": 539102233, "pvalue": 0.014726495997467478, "logp": 1.83190057630699, "type": "variant"}, {"pos": 539102266, "pvalue": 0.006540747845266288, "logp": 2.184372593188823, "type": "variant"}, {"pos": 539102316, "pvalue": 0.3609254121172666, "logp": 0.442582538960807, "type": "variant"}, {"pos": 539102387, "pvalue": 0.6157323699842197, "logp": 0.21060801428899342, "type": "variant"}, {"pos": 539102548, "pvalue": 0.3879361989345673, "logp": 0.4112396938105259, "type": "variant"}, {"pos": 539102650, "pvalue": 0.008822871884436837, "logp": 2.0543900270507356, "type": "variant"}, {"pos": 539102683, "pvalue": 0.5930744852834953, "logp": 0.2268907593909414, "type": "variant"}, {"pos": 539102699, "pvalue": 0.026262089853789007, "logp": 1.5806707170944012, "type": "variant"}, {"pos": 539102737, "pvalue": 0.0966820649301172, "logp": 1.0146540825281587, "type": "variant"}, {"pos": 539102773, "pvalue": 3.376175807784613e-06, "logp": 5.471574946417606, "type": "variant"}, {"pos": 539102874, "pvalue": 0.8179109529842228, "logp": 0.08729397595297396, "type": "variant"}, {"pos": 539102939, "pvalue": 0.0009020832082983534, "logp": 3.0447534012184403, "type": "variant"}, {"pos": 539102989, "pvalue": 0.0016912757387848442, "logp": 2.771785581006489, "type": "variant"}, {"pos": 539102992, "pvalue": 0.135846661336354, "logp": 0.8669510306433367, "type": "variant"}, {"pos": 539103000, "pvalue": 0.135846661336354, "logp": 0.8669510306433367, "type": "variant"}, {"pos": 539103090, "pvalue": 0.135846661336354, "logp": 0.8669510306433367, "type": "variant"}, {"pos": 539103169, "pvalue": 0.006748614968763363, "logp": 2.1707853491162026, "type": "variant"}, {"pos": 539103292, "pvalue": 0.01856373664561637, "logp": 1.7313346013264224, "type": "variant"}, {"pos": 539103407, "pvalue": 0.03683274234514106, "logp": 1.4337659449782578, "type": "variant"}, {"pos": 539103418, "pvalue": 0.9111923766555985, "logp": 0.04038992236865834, "type": "variant"}, {"pos": 539103434, "pvalue": 0.0015922465977242534, "logp": 2.7979896704317255, "type": "variant"}, {"pos": 539103439, "pvalue": 0.027254744422692538, "logp": 1.5645578861490252, "type": "variant"}, {"pos": 539103441, "pvalue": 0.5930744852834953, "logp": 0.2268907593909414, "type": "variant"}, {"pos": 539103447, "pvalue": 0.5930744852834953, "logp": 0.2268907593909414, "type": "variant"}, {"pos": 539103536, "pvalue": 0.027254744422692538, "logp": 1.5645578861490252, "type": "variant"}, {"pos": 539103744, "pvalue": 0.7613261216660867, "logp": 0.11842926898401886, "type": "variant"}, {"pos": 539103762, "pvalue": 0.0010492023978147756, "logp": 2.979140725557346, "type": "variant"}, {"pos": 539103891, "pvalue": 0.47432473433348554, "logp": 0.3239242278582203, "type": "variant"}, {"pos": 539104152, "pvalue": 0.0002175773927463288, "logp": 3.662386231747664, "type": "variant"}, {"pos": 539104158, "pvalue": 0.08979830033724107, "logp": 1.0467318833899673, "type": "variant"}, {"pos": 539104242, "pvalue": 0.384527438301463, "logp": 0.4150726652832034, "type": "variant"}, {"pos": 539104252, "pvalue": 0.006748614968763363, "logp": 2.1707853491162026, "type": "variant"}, {"pos": 539104257, "pvalue": 0.135846661336354, "logp": 0.8669510306433367, "type": "variant"}, {"pos": 539104389, "pvalue": 0.0029316812590211294, "logp": 2.532883249233204, "type": "variant"}, {"pos": 539104410, "pvalue": 0.014628993406985253, "logp": 1.8347855558180575, "type": "variant"}, {"pos": 539104440, "pvalue": 0.014628993406985253, "logp": 1.8347855558180575, "type": "variant"}, {"pos": 539104560, "pvalue": 9.17436965504636e-10, "logp": 9.0374237651946, "type": "variant"}, {"pos": 539105026, "pvalue": 0.135846661336354, "logp": 0.8669510306433367, "type": "variant"}, {"pos": 539105045, "pvalue": 0.9476360105825549, "logp": 0.023358444255581336, "type": "variant"}, {"pos": 539105071, "pvalue": 1.5997629618963846e-06, "logp": 5.79594436232326, "type": "variant"}];
const margin = {top: 30, right: 40, bottom: 60, left: 70};
const container = document.getElementById('manhattan');
const width = container.clientWidth - margin.left - margin.right;
const height = 450 - margin.top - margin.bottom;

const svg = d3.select('#manhattan')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

// 比例尺
const xScale = d3.scaleLinear()
    .domain([539101555, 539105112])
    .range([0, width]);

const maxLogP = data.length > 0 ? Math.max(...data.map(d => d.logp)) * 1.1 : 5;
const yScale = d3.scaleLinear()
    .domain([0, Math.max(maxLogP, 3)])
    .range([height, 0]);

// 坐标轴
svg.append('g')
    .attr('transform', `translate(0,${height})`)
    .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => (d/1000000).toFixed(2) + 'M'));

svg.append('g')
    .call(d3.axisLeft(yScale));

// 坐标轴标签
svg.append('text')
    .attr('class', 'axis-label')
    .attr('x', width / 2)
    .attr('y', height + 45)
    .attr('text-anchor', 'middle')
    .text('Position (Mb)');

svg.append('text')
    .attr('class', 'axis-label')
    .attr('transform', 'rotate(-90)')
    .attr('x', -height / 2)
    .attr('y', -50)
    .attr('text-anchor', 'middle')
    .text('-log10(P-value)');

// 阈值线
const thresholds = [
    {value: -Math.log10(0.05), color: '#e74c3c', label: 'P=0.05'},
    {value: -Math.log10(0.01), color: '#8B0000', label: 'P=0.01'}
];

thresholds.forEach(t => {
    if (t.value <= maxLogP) {
        svg.append('line')
            .attr('class', 'threshold-line')
            .attr('x1', 0)
            .attr('x2', width)
            .attr('y1', yScale(t.value))
            .attr('y2', yScale(t.value))
            .attr('stroke', t.color)
            .attr('stroke-width', 1.5);
    }
});

// 绘制点
const tooltip = d3.select('#tooltip');

svg.selectAll('circle')
    .data(data)
    .enter()
    .append('circle')
    .attr('cx', d => xScale(d.pos))
    .attr('cy', d => yScale(d.logp))
    .attr('r', 5)
    .attr('fill', d => {
        if (d.pvalue < 0.01) return '#8B0000';
        if (d.pvalue < 0.05) return '#e74c3c';
        return '#3498db';
    })
    .attr('opacity', 0.7)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', 8).attr('opacity', 1);
        tooltip.style('display', 'block')
            .html(`<strong>Position:</strong> ${d.pos.toLocaleString()}<br>
                   <strong>P-value:</strong> ${d.pvalue.toExponential(2)}<br>
                   <strong>-log10(P):</strong> ${d.logp.toFixed(2)}`);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px')
               .style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function() {
        d3.select(this).attr('r', 5).attr('opacity', 0.7);
        tooltip.style('display', 'none');
    });
</script>
</body>
</html>
