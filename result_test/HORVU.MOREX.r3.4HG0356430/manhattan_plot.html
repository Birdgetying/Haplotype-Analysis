<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manhattan Plot - Region chr4H:146,944,089-146,946,975</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white;
                  padding: 20px 30px; border-radius: 10px 10px 0 0; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header-info { font-size: 13px; opacity: 0.9; }
        .plot-container { padding: 30px; }
        #manhattan { width: 100%; height: 450px; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .axis text { font-size: 11px; }
        .axis-label { font-size: 13px; font-weight: 600; }
        .threshold-line { stroke-dasharray: 5,5; }
        .legend { display: flex; gap: 20px; padding: 15px 30px; border-top: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Manhattan Plot</h1>
        <div class="header-info">Region: chr4H:146,944,089 - 146,946,975 | Variants: 27</div>
    </div>
    
    <div class="plot-container">
        <div id="manhattan"></div>
    </div>
    
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#3498db;"></div>Variants</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e74c3c;"></div>P &lt; 0.05</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8B0000;"></div>P &lt; 0.01</div>
        <div class="legend-item"><span style="color:#e74c3c;">---</span> P = 0.05</div>
        <div class="legend-item"><span style="color:#8B0000;">---</span> P = 0.01</div>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"pos": 146944140, "pvalue": 0.0173270441588697, "logp": 1.7612755177812054, "type": "variant"}, {"pos": 146944409, "pvalue": 0.00014196995679121482, "logp": 3.847803549843996, "type": "variant"}, {"pos": 146945201, "pvalue": 0.22212270140081192, "logp": 0.6534070533863435, "type": "variant"}, {"pos": 146945333, "pvalue": 0.6534686146526177, "logp": 0.18477526624794144, "type": "variant"}, {"pos": 146945363, "pvalue": 0.00020168561070111558, "logp": 3.695325085505745, "type": "variant"}, {"pos": 146945422, "pvalue": 3.091533283186271e-11, "logp": 10.509826073562218, "type": "variant"}, {"pos": 146945519, "pvalue": 0.013060779249646489, "logp": 1.884030910830811, "type": "variant"}, {"pos": 146945584, "pvalue": 0.10914688376710312, "logp": 0.9619886592408802, "type": "variant"}, {"pos": 146945706, "pvalue": 0.0020386492763823307, "logp": 2.690657482624608, "type": "variant"}, {"pos": 146945724, "pvalue": 0.00028198468091665015, "logp": 3.54977448449652, "type": "variant"}, {"pos": 146945745, "pvalue": 0.0173270441588697, "logp": 1.7612755177812054, "type": "variant"}, {"pos": 146945750, "pvalue": 0.14098515462282357, "logp": 0.850826615038364, "type": "variant"}, {"pos": 146945759, "pvalue": 0.10851160882959555, "logp": 0.9645237974749797, "type": "variant"}, {"pos": 146945826, "pvalue": 0.0173270441588697, "logp": 1.7612755177812054, "type": "variant"}, {"pos": 146945860, "pvalue": 0.0020386492763823307, "logp": 2.690657482624608, "type": "variant"}, {"pos": 146945881, "pvalue": 0.00014196995679121482, "logp": 3.847803549843996, "type": "variant"}, {"pos": 146945927, "pvalue": 0.5287025363622012, "logp": 0.27678860613457856, "type": "variant"}, {"pos": 146945978, "pvalue": 0.00017124803517910996, "logp": 3.766374402701322, "type": "variant"}, {"pos": 146946302, "pvalue": 0.006538662248979237, "logp": 2.1845110953017004, "type": "variant"}, {"pos": 146946322, "pvalue": 3.0296640721367934e-11, "logp": 10.518605523215586, "type": "variant"}, {"pos": 146946351, "pvalue": 0.01984121636476516, "logp": 1.7024317069644677, "type": "variant"}, {"pos": 146946600, "pvalue": 0.7997066411777629, "logp": 0.09706929736165462, "type": "variant"}, {"pos": 146946680, "pvalue": 0.0002734601175848908, "logp": 3.563106003794182, "type": "variant"}, {"pos": 146946757, "pvalue": 3.9318198202288573e-16, "logp": 15.405406392384485, "type": "variant"}, {"pos": 146946790, "pvalue": 0.042442674142244646, "logp": 1.3721972607595416, "type": "variant"}, {"pos": 146946897, "pvalue": 0.006538662248979237, "logp": 2.1845110953017004, "type": "variant"}, {"pos": 146946959, "pvalue": 0.00014196995679121482, "logp": 3.847803549843996, "type": "variant"}];
const margin = {top: 30, right: 40, bottom: 60, left: 70};
const container = document.getElementById('manhattan');
const width = container.clientWidth - margin.left - margin.right;
const height = 450 - margin.top - margin.bottom;

const svg = d3.select('#manhattan')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

// 比例尺
const xScale = d3.scaleLinear()
    .domain([146944089, 146946975])
    .range([0, width]);

const maxLogP = data.length > 0 ? Math.max(...data.map(d => d.logp)) * 1.1 : 5;
const yScale = d3.scaleLinear()
    .domain([0, Math.max(maxLogP, 3)])
    .range([height, 0]);

// 坐标轴
svg.append('g')
    .attr('transform', `translate(0,${height})`)
    .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => (d/1000000).toFixed(2) + 'M'));

svg.append('g')
    .call(d3.axisLeft(yScale));

// 坐标轴标签
svg.append('text')
    .attr('class', 'axis-label')
    .attr('x', width / 2)
    .attr('y', height + 45)
    .attr('text-anchor', 'middle')
    .text('Position (Mb)');

svg.append('text')
    .attr('class', 'axis-label')
    .attr('transform', 'rotate(-90)')
    .attr('x', -height / 2)
    .attr('y', -50)
    .attr('text-anchor', 'middle')
    .text('-log10(P-value)');

// 阈值线
const thresholds = [
    {value: -Math.log10(0.05), color: '#e74c3c', label: 'P=0.05'},
    {value: -Math.log10(0.01), color: '#8B0000', label: 'P=0.01'}
];

thresholds.forEach(t => {
    if (t.value <= maxLogP) {
        svg.append('line')
            .attr('class', 'threshold-line')
            .attr('x1', 0)
            .attr('x2', width)
            .attr('y1', yScale(t.value))
            .attr('y2', yScale(t.value))
            .attr('stroke', t.color)
            .attr('stroke-width', 1.5);
    }
});

// 绘制点
const tooltip = d3.select('#tooltip');

svg.selectAll('circle')
    .data(data)
    .enter()
    .append('circle')
    .attr('cx', d => xScale(d.pos))
    .attr('cy', d => yScale(d.logp))
    .attr('r', 5)
    .attr('fill', d => {
        if (d.pvalue < 0.01) return '#8B0000';
        if (d.pvalue < 0.05) return '#e74c3c';
        return '#3498db';
    })
    .attr('opacity', 0.7)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', 8).attr('opacity', 1);
        tooltip.style('display', 'block')
            .html(`<strong>Position:</strong> ${d.pos.toLocaleString()}<br>
                   <strong>P-value:</strong> ${d.pvalue.toExponential(2)}<br>
                   <strong>-log10(P):</strong> ${d.logp.toFixed(2)}`);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px')
               .style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function() {
        d3.select(this).attr('r', 5).attr('opacity', 0.7);
        tooltip.style('display', 'none');
    });
</script>
</body>
</html>
