<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P-value Heatmap - Gene Region</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
        .header { margin-bottom: 25px; }
        .header h1 { font-size: 22px; color: #2c3e50; margin-bottom: 8px; }
        .header p { font-size: 13px; color: #7f8c8d; }
        #heatmap { width: 100%; height: 300px; }
        .color-scale { display: flex; align-items: center; gap: 15px; margin-top: 20px; padding: 15px;
                       background: #f8f9fa; border-radius: 8px; }
        .color-scale-bar { width: 200px; height: 20px; border-radius: 3px; }
        .color-scale-labels { display: flex; justify-content: space-between; width: 200px; font-size: 11px; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .gene-structure { fill: #3498db; }
        .promoter-region { fill: #f39c12; opacity: 0.5; }
        .axis text { font-size: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>P-value Heatmap Overlay</h1>
        <p>Region: chr6H:9,440,142 - 9,445,419 | Gene: 9,440,142 - 9,443,419 | Variants: 50</p>
    </div>
    
    <div id="heatmap"></div>
    
    <div class="color-scale">
        <span style="font-size:13px;font-weight:600;">-log10(P-value):</span>
        <div>
            <div class="color-scale-bar" style="background: linear-gradient(to right, #ffffcc, #fd8d3c, #bd0026);"></div>
            <div class="color-scale-labels"><span>0 (ns)</span><span>1.3 (P=0.05)</span><span>2+ (P&lt;0.01)</span></div>
        </div>
        <span style="margin-left:20px;font-size:12px;color:#666;">Significant variants shown as larger circles</span>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"pos": 9440194, "pvalue": 1.0, "logp": -0.0, "significant": false}, {"pos": 9440343, "pvalue": 0.03320122159112818, "logp": 1.47884593676205, "significant": true}, {"pos": 9440458, "pvalue": 8.260498688827917e-05, "logp": 4.082993733397707, "significant": true}, {"pos": 9440500, "pvalue": 0.00060271038611615, "logp": 3.2198913245532137, "significant": true}, {"pos": 9440746, "pvalue": 0.11040856906960207, "logp": 0.9569972186790816, "significant": false}, {"pos": 9440986, "pvalue": 0.334309221165464, "logp": 0.4758516442089663, "significant": false}, {"pos": 9440989, "pvalue": 0.0027950621743055644, "logp": 2.5536085270772, "significant": true}, {"pos": 9441144, "pvalue": 9.697261728433088e-07, "logp": 6.013350882653196, "significant": true}, {"pos": 9441224, "pvalue": 0.4340568528665104, "logp": 0.3624533827706085, "significant": false}, {"pos": 9441417, "pvalue": 0.00683463834585303, "logp": 2.1652844611335893, "significant": true}, {"pos": 9441755, "pvalue": 0.04637986686446783, "logp": 1.3336705023584445, "significant": true}, {"pos": 9441789, "pvalue": 0.005941853380175646, "logp": 2.2260780689521256, "significant": true}, {"pos": 9441975, "pvalue": 0.9185793591196617, "logp": 0.03688331759559019, "significant": false}, {"pos": 9442296, "pvalue": 0.003985969431285245, "logp": 2.399466036261483, "significant": true}, {"pos": 9442740, "pvalue": 6.300531003511036e-05, "logp": 4.200622847026331, "significant": true}, {"pos": 9442816, "pvalue": 0.5080856914216669, "logp": 0.2940630354067946, "significant": false}, {"pos": 9442942, "pvalue": 0.5080856914216669, "logp": 0.2940630354067946, "significant": false}, {"pos": 9443005, "pvalue": 0.8438530105561848, "logp": 0.07373319586703728, "significant": false}, {"pos": 9443047, "pvalue": 0.09184659317385925, "logp": 1.0369369481576702, "significant": false}, {"pos": 9443053, "pvalue": 0.9341334183548005, "logp": 0.029591090882101455, "significant": false}, {"pos": 9443152, "pvalue": 0.2147201899755415, "logp": 0.6681271172651404, "significant": false}, {"pos": 9443227, "pvalue": 0.2689143308392174, "logp": 0.5703860529698841, "significant": false}, {"pos": 9443239, "pvalue": 0.17104842070151974, "logp": 0.7668809313227165, "significant": false}, {"pos": 9443331, "pvalue": 0.9872819418919851, "logp": 0.005558806476683013, "significant": false}, {"pos": 9443491, "pvalue": 0.22842011952096045, "logp": 0.6412656455570893, "significant": false}, {"pos": 9443540, "pvalue": 0.5524173569808577, "logp": 0.2577326843247877, "significant": false}, {"pos": 9443555, "pvalue": 0.7901965978707858, "logp": 0.10226484447123307, "significant": false}, {"pos": 9443578, "pvalue": 0.008773128347736739, "logp": 2.0568455170216837, "significant": true}, {"pos": 9443584, "pvalue": 0.06502074704423484, "logp": 1.1869480450625138, "significant": false}, {"pos": 9443607, "pvalue": 0.010618083639831626, "logp": 1.9739538579952125, "significant": true}, {"pos": 9443665, "pvalue": 0.2249129160933338, "logp": 0.647985603581735, "significant": false}, {"pos": 9443760, "pvalue": 0.5287087998046947, "logp": 0.27678346115755853, "significant": false}, {"pos": 9444571, "pvalue": 2.8441824047519115e-06, "logp": 5.546042554624069, "significant": true}, {"pos": 9444587, "pvalue": 4.0327465576744026e-07, "logp": 6.394399070841899, "significant": true}, {"pos": 9444662, "pvalue": 0.0005550739469543798, "logp": 3.255649156309789, "significant": true}, {"pos": 9444688, "pvalue": 0.0075053950250230156, "logp": 2.1246264449699552, "significant": true}, {"pos": 9444737, "pvalue": 0.17870356555884628, "logp": 0.7478667822056955, "significant": false}, {"pos": 9444752, "pvalue": 0.0007178087660789963, "logp": 3.143991242246176, "significant": true}, {"pos": 9444773, "pvalue": 0.000660510821895753, "logp": 3.180120062453531, "significant": true}, {"pos": 9444903, "pvalue": 0.0011976007227262084, "logp": 2.9216879505775712, "significant": true}, {"pos": 9444958, "pvalue": 0.0023250876014935134, "logp": 2.633560679707993, "significant": true}, {"pos": 9445005, "pvalue": 0.07484682458890851, "logp": 1.1258266200740097, "significant": false}, {"pos": 9445068, "pvalue": 0.17063616158834663, "logp": 0.7679289267789133, "significant": false}, {"pos": 9445114, "pvalue": 0.17063616158834663, "logp": 0.7679289267789133, "significant": false}, {"pos": 9445140, "pvalue": 0.00614352105587825, "logp": 2.211582648916791, "significant": true}, {"pos": 9445172, "pvalue": 0.4166416781867116, "logp": 0.38023728815414054, "significant": false}, {"pos": 9445385, "pvalue": 0.4986773272177387, "logp": 0.3021803768950629, "significant": false}, {"pos": 9445393, "pvalue": 0.20421753467362447, "logp": 0.6899069709412912, "significant": false}, {"pos": 9445401, "pvalue": 0.9248974877282718, "logp": 0.033906400213501046, "significant": false}, {"pos": 9445419, "pvalue": 0.1373289105399254, "logp": 0.8622380252814434, "significant": false}];
const regionStart = 9440142;
const regionEnd = 9445419;
const geneStart = 9440142;
const geneEnd = 9443419;

const margin = {top: 50, right: 30, bottom: 50, left: 60};
const container = document.getElementById('heatmap');
const width = container.clientWidth - margin.left - margin.right;
const height = 300 - margin.top - margin.bottom;

const svg = d3.select('#heatmap')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

// 比例尺
const xScale = d3.scaleLinear()
    .domain([regionStart, regionEnd])
    .range([0, width]);

const maxLogP = data.length > 0 ? Math.max(...data.map(d => d.logp), 2) : 2;

// 颜色比例尺 (黄-橙-红)
const colorScale = d3.scaleSequential(d3.interpolateYlOrRd)
    .domain([0, maxLogP]);

// 绘制区域背景
svg.append('rect')
    .attr('x', 0)
    .attr('y', height * 0.3)
    .attr('width', width)
    .attr('height', height * 0.4)
    .attr('fill', '#f8f9fa')
    .attr('rx', 4);

// 绘制基因结构
const geneX1 = xScale(geneStart);
const geneX2 = xScale(geneEnd);
const geneY = height * 0.5;
const geneH = height * 0.15;

// 基因主体
svg.append('rect')
    .attr('class', 'gene-structure')
    .attr('x', geneX1)
    .attr('y', geneY - geneH/2)
    .attr('width', geneX2 - geneX1)
    .attr('height', geneH)
    .attr('rx', 3);

// 启动子区域（基因5'端上游）- **根据实际扩展情况绘制**
if (hasPromoter) {
    // 从 gene_info.json 中读取实际启动子长度
    var promoterActualLength = 2000;
    var promoterEnd = geneStart;
    var promoterStart = Math.max(regionStart, geneStart - promoterActualLength);
    if (promoterStart < promoterEnd) {
        svg.append('rect')
            .attr('class', 'promoter-region')
            .attr('x', xScale(promoterStart))
            .attr('y', geneY - geneH/2)
            .attr('width', xScale(promoterEnd) - xScale(promoterStart))
            .attr('height', geneH)
            .attr('rx', 2)
            .attr('stroke', '#e67e22')
            .attr('stroke-width', 1)
            .attr('stroke-dasharray', '3,2');
    }
}

// 坐标轴
svg.append('g')
    .attr('transform', `translate(0,${height * 0.85})`)
    .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => (d/1000).toFixed(0) + 'k'));

svg.append('text')
    .attr('x', width / 2)
    .attr('y', height + 5)
    .attr('text-anchor', 'middle')
    .attr('font-size', '12px')
    .attr('fill', '#333')
    .text('Position (bp)');

// 热图点
const tooltip = d3.select('#tooltip');

svg.selectAll('.heatmap-point')
    .data(data)
    .enter()
    .append('circle')
    .attr('class', 'heatmap-point')
    .attr('cx', d => xScale(d.pos))
    .attr('cy', geneY - geneH - 15)  // 在基因上方
    .attr('r', d => d.significant ? 7 : 4)
    .attr('fill', d => colorScale(d.logp))
    .attr('stroke', d => d.significant ? '#000' : 'none')
    .attr('stroke-width', d => d.significant ? 1.5 : 0)
    .attr('opacity', 0.85)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', d.significant ? 10 : 6);
        tooltip.style('display', 'block')
            .html(`<strong>Position:</strong> ${d.pos.toLocaleString()}<br>
                   <strong>P-value:</strong> ${d.pvalue < 0.001 ? d.pvalue.toExponential(2) : d.pvalue.toFixed(4)}<br>
                   <strong>-log10(P):</strong> ${d.logp.toFixed(2)}<br>
                   <strong>Significant:</strong> ${d.significant ? 'Yes' : 'No'}`);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px').style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function(event, d) {
        d3.select(this).attr('r', d.significant ? 7 : 4);
        tooltip.style('display', 'none');
    });

// 连接线（从热图点到基因位置）
svg.selectAll('.connect-line')
    .data(data.filter(d => d.significant))
    .enter()
    .append('line')
    .attr('class', 'connect-line')
    .attr('x1', d => xScale(d.pos))
    .attr('y1', geneY - geneH - 8)
    .attr('x2', d => xScale(d.pos))
    .attr('y2', geneY - geneH/2 - 2)
    .attr('stroke', d => colorScale(d.logp))
    .attr('stroke-width', 1.5)
    .attr('stroke-dasharray', '3,2');

// 标题和图例
svg.append('text')
    .attr('x', 0)
    .attr('y', -25)
    .attr('font-size', '14px')
    .attr('font-weight', '600')
    .attr('fill', '#2c3e50')
    .text('P-value Distribution Across Gene Region');

// 区域标签
svg.append('text')
    .attr('x', (geneX1 + geneX2) / 2)
    .attr('y', geneY + geneH/2 + 15)
    .attr('text-anchor', 'middle')
    .attr('font-size', '11px')
    .attr('fill', '#2c3e50')
    .text('Gene Body');

if (promoterStart < promoterEnd) {
    svg.append('text')
        .attr('x', (xScale(promoterStart) + xScale(promoterEnd)) / 2)
        .attr('y', geneY + geneH/2 + 15)
        .attr('text-anchor', 'middle')
        .attr('font-size', '10px')
        .attr('fill', '#e67e22')
        .text('Promoter');
}
</script>
</body>
</html>
