<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P-value Heatmap - Gene Region</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
        .header { margin-bottom: 25px; }
        .header h1 { font-size: 22px; color: #2c3e50; margin-bottom: 8px; }
        .header p { font-size: 13px; color: #7f8c8d; }
        #heatmap { width: 100%; height: 300px; }
        .color-scale { display: flex; align-items: center; gap: 15px; margin-top: 20px; padding: 15px;
                       background: #f8f9fa; border-radius: 8px; }
        .color-scale-bar { width: 200px; height: 20px; border-radius: 3px; }
        .color-scale-labels { display: flex; justify-content: space-between; width: 200px; font-size: 11px; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .gene-structure { fill: #3498db; }
        .promoter-region { fill: #f39c12; opacity: 0.5; }
        .axis text { font-size: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>P-value Heatmap Overlay</h1>
        <p>Region: chr1H:488,625,943 - 488,630,389 | Gene: 488,625,943 - 488,628,389 | Variants: 57</p>
    </div>
    
    <div id="heatmap"></div>
    
    <div class="color-scale">
        <span style="font-size:13px;font-weight:600;">-log10(P-value):</span>
        <div>
            <div class="color-scale-bar" style="background: linear-gradient(to right, #ffffcc, #fd8d3c, #bd0026);"></div>
            <div class="color-scale-labels"><span>0 (ns)</span><span>1.3 (P=0.05)</span><span>2+ (P&lt;0.01)</span></div>
        </div>
        <span style="margin-left:20px;font-size:12px;color:#666;">Significant variants shown as larger circles</span>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"pos": 488626020, "pvalue": 1.0, "logp": -0.0, "significant": false}, {"pos": 488626114, "pvalue": 0.8212594699959306, "logp": 0.08551960952560096, "significant": false}, {"pos": 488626130, "pvalue": 6.9164814365453904e-12, "logp": 11.160114784345778, "significant": true}, {"pos": 488626132, "pvalue": 0.012806251924894003, "logp": 1.8925779589763867, "significant": true}, {"pos": 488626166, "pvalue": 0.012806251924894003, "logp": 1.8925779589763867, "significant": true}, {"pos": 488626213, "pvalue": 0.0011063626178739894, "logp": 2.9561025067285716, "significant": true}, {"pos": 488626406, "pvalue": 0.0030571364402650863, "logp": 2.514685178240894, "significant": true}, {"pos": 488626501, "pvalue": 0.1972920784281757, "logp": 0.7048903519702967, "significant": false}, {"pos": 488626593, "pvalue": 0.5663694822983104, "logp": 0.24690015578882352, "significant": false}, {"pos": 488626607, "pvalue": 0.521230069319703, "logp": 0.28297053815719897, "significant": false}, {"pos": 488626610, "pvalue": 0.4433619326852358, "logp": 0.3532415983989426, "significant": false}, {"pos": 488626640, "pvalue": 0.4433619326852358, "logp": 0.3532415983989426, "significant": false}, {"pos": 488626854, "pvalue": 4.3995883066856944e-05, "logp": 4.35658796090014, "significant": true}, {"pos": 488627060, "pvalue": 0.5442041443662399, "logp": 0.2642381551903377, "significant": false}, {"pos": 488627256, "pvalue": 0.41322185866398387, "logp": 0.38381671317840443, "significant": false}, {"pos": 488627499, "pvalue": 1.0035672354615146e-11, "logp": 10.998453526004843, "significant": true}, {"pos": 488627548, "pvalue": 8.658001644348203e-10, "logp": 9.062582336040617, "significant": true}, {"pos": 488627569, "pvalue": 1.049308377226584e-09, "logp": 8.979096859903349, "significant": true}, {"pos": 488627668, "pvalue": 8.871521741422692e-10, "logp": 9.052001878790769, "significant": true}, {"pos": 488627670, "pvalue": 0.23384227497348306, "logp": 0.6310769725239345, "significant": false}, {"pos": 488627691, "pvalue": 0.23384227497348306, "logp": 0.6310769725239345, "significant": false}, {"pos": 488627724, "pvalue": 0.23384227497348306, "logp": 0.6310769725239345, "significant": false}, {"pos": 488627727, "pvalue": 0.23384227497348306, "logp": 0.6310769725239345, "significant": false}, {"pos": 488627811, "pvalue": 0.23384227497348306, "logp": 0.6310769725239345, "significant": false}, {"pos": 488627820, "pvalue": 0.1657069517268594, "logp": 0.7806592717056761, "significant": false}, {"pos": 488628138, "pvalue": 0.41671377938785625, "logp": 0.3801621385799961, "significant": false}, {"pos": 488628230, "pvalue": 8.323346846303405e-05, "logp": 4.079702007289792, "significant": true}, {"pos": 488628357, "pvalue": 0.14943520701710544, "logp": 0.8255470704461866, "significant": false}, {"pos": 488628390, "pvalue": 0.14603108920187377, "logp": 0.8355546755067794, "significant": false}, {"pos": 488628551, "pvalue": 0.32724135484380434, "logp": 0.48513181794214116, "significant": false}, {"pos": 488628559, "pvalue": 0.003178966364982832, "logp": 2.4977140671087037, "significant": true}, {"pos": 488628642, "pvalue": 0.8485678446957797, "logp": 0.0713134292460152, "significant": false}, {"pos": 488628821, "pvalue": 0.04682414741812341, "logp": 1.3295301215870088, "significant": true}, {"pos": 488628848, "pvalue": 0.025916301868489023, "logp": 1.586426970112128, "significant": true}, {"pos": 488628927, "pvalue": 3.64939944106379e-08, "logp": 7.437778598801495, "significant": true}, {"pos": 488628969, "pvalue": 6.075398022523625e-08, "logp": 7.216425264507719, "significant": true}, {"pos": 488629003, "pvalue": 0.06405872104643379, "logp": 1.193421736418703, "significant": false}, {"pos": 488629012, "pvalue": 0.01108992919400967, "logp": 1.9550712266866428, "significant": true}, {"pos": 488629021, "pvalue": 0.016274979464885323, "logp": 1.788479550734739, "significant": true}, {"pos": 488629060, "pvalue": 0.016274979464885323, "logp": 1.788479550734739, "significant": true}, {"pos": 488629162, "pvalue": 0.40453737448372973, "logp": 0.3930413485085108, "significant": false}, {"pos": 488629192, "pvalue": 0.9284233565075279, "logp": 0.032253942457026126, "significant": false}, {"pos": 488629200, "pvalue": 0.0018794597062498069, "logp": 2.7259669806928915, "significant": true}, {"pos": 488629217, "pvalue": 0.16477650294171767, "logp": 0.7831047184296022, "significant": false}, {"pos": 488629662, "pvalue": 0.1627487814129261, "logp": 0.7884822545424015, "significant": false}, {"pos": 488629672, "pvalue": 0.2628536396777914, "logp": 0.5802860050216758, "significant": false}, {"pos": 488629684, "pvalue": 0.041991258081250364, "logp": 1.3768411134649456, "significant": true}, {"pos": 488629769, "pvalue": 1.1299070716605116e-05, "logp": 4.946957273264035, "significant": true}, {"pos": 488629974, "pvalue": 1.1299070716605116e-05, "logp": 4.946957273264035, "significant": true}, {"pos": 488630031, "pvalue": 1.7324776744326775e-05, "logp": 4.761332353214375, "significant": true}, {"pos": 488630122, "pvalue": 0.03218928990098984, "logp": 1.4922886037891696, "significant": true}, {"pos": 488630144, "pvalue": 0.04335866040797827, "logp": 1.362924144052929, "significant": true}, {"pos": 488630170, "pvalue": 0.23747909482873653, "logp": 0.6243746150922569, "significant": false}, {"pos": 488630297, "pvalue": 0.24209098888764075, "logp": 0.6160213755694454, "significant": false}, {"pos": 488630301, "pvalue": 0.03218928990098984, "logp": 1.4922886037891696, "significant": true}, {"pos": 488630330, "pvalue": 0.040091603372510796, "logp": 1.3969465747819179, "significant": true}, {"pos": 488630370, "pvalue": 2.873275561152938e-09, "logp": 8.541622721049727, "significant": true}];
const regionStart = 488625943;
const regionEnd = 488630389;
const geneStart = 488625943;
const geneEnd = 488628389;

const margin = {top: 50, right: 30, bottom: 50, left: 60};
const container = document.getElementById('heatmap');
const width = container.clientWidth - margin.left - margin.right;
const height = 300 - margin.top - margin.bottom;

const svg = d3.select('#heatmap')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

// 比例尺
const xScale = d3.scaleLinear()
    .domain([regionStart, regionEnd])
    .range([0, width]);

const maxLogP = data.length > 0 ? Math.max(...data.map(d => d.logp), 2) : 2;

// 颜色比例尺 (黄-橙-红)
const colorScale = d3.scaleSequential(d3.interpolateYlOrRd)
    .domain([0, maxLogP]);

// 绘制区域背景
svg.append('rect')
    .attr('x', 0)
    .attr('y', height * 0.3)
    .attr('width', width)
    .attr('height', height * 0.4)
    .attr('fill', '#f8f9fa')
    .attr('rx', 4);

// 绘制基因结构
const geneX1 = xScale(geneStart);
const geneX2 = xScale(geneEnd);
const geneY = height * 0.5;
const geneH = height * 0.15;

// 基因主体
svg.append('rect')
    .attr('class', 'gene-structure')
    .attr('x', geneX1)
    .attr('y', geneY - geneH/2)
    .attr('width', geneX2 - geneX1)
    .attr('height', geneH)
    .attr('rx', 3);

// 启动子区域（基因5'端上游）- **根据实际扩展情况绘制**
if (hasPromoter) {
    // 从 gene_info.json 中读取实际启动子长度
    var promoterActualLength = 2000;
    var promoterEnd = geneStart;
    var promoterStart = Math.max(regionStart, geneStart - promoterActualLength);
    if (promoterStart < promoterEnd) {
        svg.append('rect')
            .attr('class', 'promoter-region')
            .attr('x', xScale(promoterStart))
            .attr('y', geneY - geneH/2)
            .attr('width', xScale(promoterEnd) - xScale(promoterStart))
            .attr('height', geneH)
            .attr('rx', 2)
            .attr('stroke', '#e67e22')
            .attr('stroke-width', 1)
            .attr('stroke-dasharray', '3,2');
    }
}

// 坐标轴
svg.append('g')
    .attr('transform', `translate(0,${height * 0.85})`)
    .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => (d/1000).toFixed(0) + 'k'));

svg.append('text')
    .attr('x', width / 2)
    .attr('y', height + 5)
    .attr('text-anchor', 'middle')
    .attr('font-size', '12px')
    .attr('fill', '#333')
    .text('Position (bp)');

// 热图点
const tooltip = d3.select('#tooltip');

svg.selectAll('.heatmap-point')
    .data(data)
    .enter()
    .append('circle')
    .attr('class', 'heatmap-point')
    .attr('cx', d => xScale(d.pos))
    .attr('cy', geneY - geneH - 15)  // 在基因上方
    .attr('r', d => d.significant ? 7 : 4)
    .attr('fill', d => colorScale(d.logp))
    .attr('stroke', d => d.significant ? '#000' : 'none')
    .attr('stroke-width', d => d.significant ? 1.5 : 0)
    .attr('opacity', 0.85)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', d.significant ? 10 : 6);
        tooltip.style('display', 'block')
            .html(`<strong>Position:</strong> ${d.pos.toLocaleString()}<br>
                   <strong>P-value:</strong> ${d.pvalue < 0.001 ? d.pvalue.toExponential(2) : d.pvalue.toFixed(4)}<br>
                   <strong>-log10(P):</strong> ${d.logp.toFixed(2)}<br>
                   <strong>Significant:</strong> ${d.significant ? 'Yes' : 'No'}`);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px').style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function(event, d) {
        d3.select(this).attr('r', d.significant ? 7 : 4);
        tooltip.style('display', 'none');
    });

// 连接线（从热图点到基因位置）
svg.selectAll('.connect-line')
    .data(data.filter(d => d.significant))
    .enter()
    .append('line')
    .attr('class', 'connect-line')
    .attr('x1', d => xScale(d.pos))
    .attr('y1', geneY - geneH - 8)
    .attr('x2', d => xScale(d.pos))
    .attr('y2', geneY - geneH/2 - 2)
    .attr('stroke', d => colorScale(d.logp))
    .attr('stroke-width', 1.5)
    .attr('stroke-dasharray', '3,2');

// 标题和图例
svg.append('text')
    .attr('x', 0)
    .attr('y', -25)
    .attr('font-size', '14px')
    .attr('font-weight', '600')
    .attr('fill', '#2c3e50')
    .text('P-value Distribution Across Gene Region');

// 区域标签
svg.append('text')
    .attr('x', (geneX1 + geneX2) / 2)
    .attr('y', geneY + geneH/2 + 15)
    .attr('text-anchor', 'middle')
    .attr('font-size', '11px')
    .attr('fill', '#2c3e50')
    .text('Gene Body');

if (promoterStart < promoterEnd) {
    svg.append('text')
        .attr('x', (xScale(promoterStart) + xScale(promoterEnd)) / 2)
        .attr('y', geneY + geneH/2 + 15)
        .attr('text-anchor', 'middle')
        .attr('font-size', '10px')
        .attr('fill', '#e67e22')
        .text('Promoter');
}
</script>
</body>
</html>
