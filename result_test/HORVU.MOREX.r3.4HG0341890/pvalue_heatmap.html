<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P-value Heatmap - Gene Region</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
        .header { margin-bottom: 25px; }
        .header h1 { font-size: 22px; color: #2c3e50; margin-bottom: 8px; }
        .header p { font-size: 13px; color: #7f8c8d; }
        #heatmap { width: 100%; height: 300px; }
        .color-scale { display: flex; align-items: center; gap: 15px; margin-top: 20px; padding: 15px;
                       background: #f8f9fa; border-radius: 8px; }
        .color-scale-bar { width: 200px; height: 20px; border-radius: 3px; }
        .color-scale-labels { display: flex; justify-content: space-between; width: 200px; font-size: 11px; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .gene-structure { fill: #3498db; }
        .promoter-region { fill: #f39c12; opacity: 0.5; }
        .axis text { font-size: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>P-value Heatmap Overlay</h1>
        <p>Region: chr4H:36,777,396 - 36,783,663 | Gene: 36,779,396 - 36,783,663 | Variants: 56</p>
    </div>
    
    <div id="heatmap"></div>
    
    <div class="color-scale">
        <span style="font-size:13px;font-weight:600;">-log10(P-value):</span>
        <div>
            <div class="color-scale-bar" style="background: linear-gradient(to right, #ffffcc, #fd8d3c, #bd0026);"></div>
            <div class="color-scale-labels"><span>0 (ns)</span><span>1.3 (P=0.05)</span><span>2+ (P&lt;0.01)</span></div>
        </div>
        <span style="margin-left:20px;font-size:12px;color:#666;">Significant variants shown as larger circles</span>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"pos": 36778011, "pvalue": 1.0, "logp": -0.0, "significant": false}, {"pos": 36778362, "pvalue": 0.0008960507575189249, "logp": 3.0476673886793586, "significant": true}, {"pos": 36778363, "pvalue": 0.6814531601105538, "logp": 0.1665639901662419, "significant": false}, {"pos": 36778391, "pvalue": 0.00900935299768414, "logp": 2.0453063965486704, "significant": true}, {"pos": 36778469, "pvalue": 0.0016479483998714736, "logp": 2.783056390941041, "significant": true}, {"pos": 36778480, "pvalue": 0.0001574794968517071, "logp": 3.8027759814540474, "significant": true}, {"pos": 36778612, "pvalue": 0.000374631694115725, "logp": 3.426395483775237, "significant": true}, {"pos": 36778668, "pvalue": 0.0014726035148879232, "logp": 2.83191416726105, "significant": true}, {"pos": 36778698, "pvalue": 0.0001574794968517071, "logp": 3.8027759814540474, "significant": true}, {"pos": 36779034, "pvalue": 0.7879279654627911, "logp": 0.10351348508914585, "significant": false}, {"pos": 36779113, "pvalue": 0.0007444939636081309, "logp": 3.1281388191774964, "significant": true}, {"pos": 36779128, "pvalue": 0.2107524890778038, "logp": 0.6762272874677672, "significant": false}, {"pos": 36779165, "pvalue": 0.0011148557786193184, "logp": 2.952781310733249, "significant": true}, {"pos": 36779187, "pvalue": 0.037144805853280755, "logp": 1.4301019072592671, "significant": true}, {"pos": 36779203, "pvalue": 0.07560680384270956, "logp": 1.1214391206577043, "significant": false}, {"pos": 36779211, "pvalue": 0.17646555798130883, "logp": 0.7533400463004926, "significant": false}, {"pos": 36779281, "pvalue": 0.007761409928016487, "logp": 2.1100593781829105, "significant": true}, {"pos": 36779306, "pvalue": 0.7118943249023808, "logp": 0.14758446916919915, "significant": false}, {"pos": 36779435, "pvalue": 0.04143571642664218, "logp": 1.382625147771227, "significant": true}, {"pos": 36779490, "pvalue": 0.44154122585855005, "logp": 0.3550287409493451, "significant": false}, {"pos": 36779506, "pvalue": 0.008461507501961976, "logp": 2.0725522561738097, "significant": true}, {"pos": 36779524, "pvalue": 0.08096546827224178, "logp": 1.0917001679911589, "significant": false}, {"pos": 36780033, "pvalue": 0.007802874802442587, "logp": 2.1077453613075248, "significant": true}, {"pos": 36780088, "pvalue": 0.047929335532309957, "logp": 1.3193985918021096, "significant": true}, {"pos": 36780103, "pvalue": 0.047929335532309957, "logp": 1.3193985918021096, "significant": true}, {"pos": 36780171, "pvalue": 0.007337695506775486, "logp": 2.134440314176, "significant": true}, {"pos": 36780173, "pvalue": 0.008461507501961976, "logp": 2.0725522561738097, "significant": true}, {"pos": 36780176, "pvalue": 0.4134582791973884, "logp": 0.3835683072202521, "significant": false}, {"pos": 36780187, "pvalue": 0.2921145069036824, "logp": 0.5344468746876103, "significant": false}, {"pos": 36780209, "pvalue": 0.9895110190320642, "logp": 0.004579365198690548, "significant": false}, {"pos": 36780244, "pvalue": 0.2107524890778038, "logp": 0.6762272874677672, "significant": false}, {"pos": 36780271, "pvalue": 0.2921145069036824, "logp": 0.5344468746876103, "significant": false}, {"pos": 36780344, "pvalue": 0.8035070492006559, "logp": 0.09501030880042806, "significant": false}, {"pos": 36780442, "pvalue": 0.012554154871335243, "logp": 1.9012125180820396, "significant": true}, {"pos": 36780476, "pvalue": 0.1173320602706547, "logp": 0.930583303347462, "significant": false}, {"pos": 36780584, "pvalue": 0.00013893283512891785, "logp": 3.857195101778121, "significant": true}, {"pos": 36780642, "pvalue": 0.000374631694115725, "logp": 3.426395483775237, "significant": true}, {"pos": 36780643, "pvalue": 0.000374631694115725, "logp": 3.426395483775237, "significant": true}, {"pos": 36780852, "pvalue": 0.051211451476101726, "logp": 1.2906329148680389, "significant": false}, {"pos": 36780988, "pvalue": 0.001935670743928449, "logp": 2.713168513895347, "significant": true}, {"pos": 36781050, "pvalue": 0.1338265662540742, "logp": 0.8734576651011071, "significant": false}, {"pos": 36781099, "pvalue": 0.2921145069036824, "logp": 0.5344468746876103, "significant": false}, {"pos": 36781537, "pvalue": 0.017120438162164266, "logp": 1.7664851246486413, "significant": true}, {"pos": 36781760, "pvalue": 0.32886671276358903, "logp": 0.4829800827189071, "significant": false}, {"pos": 36781787, "pvalue": 0.6706920318833722, "logp": 0.17347685323835355, "significant": false}, {"pos": 36781928, "pvalue": 0.18503921194034945, "logp": 0.7327362298412332, "significant": false}, {"pos": 36781944, "pvalue": 0.12369475935945236, "logp": 0.9076486999625094, "significant": false}, {"pos": 36782108, "pvalue": 0.0034589588102983504, "logp": 2.461054609586288, "significant": true}, {"pos": 36782189, "pvalue": 0.001000682749530649, "logp": 2.9997035868227853, "significant": true}, {"pos": 36782301, "pvalue": 0.001000682749530649, "logp": 2.9997035868227853, "significant": true}, {"pos": 36782321, "pvalue": 0.18633694171692433, "logp": 0.7297010367120831, "significant": false}, {"pos": 36782466, "pvalue": 0.3336732618308563, "logp": 0.4766785931790803, "significant": false}, {"pos": 36782540, "pvalue": 0.8035070492006559, "logp": 0.09501030880042806, "significant": false}, {"pos": 36782803, "pvalue": 0.0008696374392351173, "logp": 3.0606617714709667, "significant": true}, {"pos": 36782890, "pvalue": 0.000744703977337539, "logp": 3.128016326657325, "significant": true}, {"pos": 36783479, "pvalue": 4.224178133332629e-06, "logp": 5.374257775916432, "significant": true}];
const regionStart = 36777396;
const regionEnd = 36783663;
const geneStart = 36779396;
const geneEnd = 36783663;

const margin = {top: 50, right: 30, bottom: 50, left: 60};
const container = document.getElementById('heatmap');
const width = container.clientWidth - margin.left - margin.right;
const height = 300 - margin.top - margin.bottom;

const svg = d3.select('#heatmap')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

// 比例尺
const xScale = d3.scaleLinear()
    .domain([regionStart, regionEnd])
    .range([0, width]);

const maxLogP = data.length > 0 ? Math.max(...data.map(d => d.logp), 2) : 2;

// 颜色比例尺 (黄-橙-红)
const colorScale = d3.scaleSequential(d3.interpolateYlOrRd)
    .domain([0, maxLogP]);

// 绘制区域背景
svg.append('rect')
    .attr('x', 0)
    .attr('y', height * 0.3)
    .attr('width', width)
    .attr('height', height * 0.4)
    .attr('fill', '#f8f9fa')
    .attr('rx', 4);

// 绘制基因结构
const geneX1 = xScale(geneStart);
const geneX2 = xScale(geneEnd);
const geneY = height * 0.5;
const geneH = height * 0.15;

// 基因主体
svg.append('rect')
    .attr('class', 'gene-structure')
    .attr('x', geneX1)
    .attr('y', geneY - geneH/2)
    .attr('width', geneX2 - geneX1)
    .attr('height', geneH)
    .attr('rx', 3);

// 启动子区域（基因5'端上游）- **根据实际扩展情况绘制**
if (hasPromoter) {
    // 从 gene_info.json 中读取实际启动子长度
    var promoterActualLength = 2000;
    var promoterEnd = geneStart;
    var promoterStart = Math.max(regionStart, geneStart - promoterActualLength);
    if (promoterStart < promoterEnd) {
        svg.append('rect')
            .attr('class', 'promoter-region')
            .attr('x', xScale(promoterStart))
            .attr('y', geneY - geneH/2)
            .attr('width', xScale(promoterEnd) - xScale(promoterStart))
            .attr('height', geneH)
            .attr('rx', 2)
            .attr('stroke', '#e67e22')
            .attr('stroke-width', 1)
            .attr('stroke-dasharray', '3,2');
    }
}

// 坐标轴
svg.append('g')
    .attr('transform', `translate(0,${height * 0.85})`)
    .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => (d/1000).toFixed(0) + 'k'));

svg.append('text')
    .attr('x', width / 2)
    .attr('y', height + 5)
    .attr('text-anchor', 'middle')
    .attr('font-size', '12px')
    .attr('fill', '#333')
    .text('Position (bp)');

// 热图点
const tooltip = d3.select('#tooltip');

svg.selectAll('.heatmap-point')
    .data(data)
    .enter()
    .append('circle')
    .attr('class', 'heatmap-point')
    .attr('cx', d => xScale(d.pos))
    .attr('cy', geneY - geneH - 15)  // 在基因上方
    .attr('r', d => d.significant ? 7 : 4)
    .attr('fill', d => colorScale(d.logp))
    .attr('stroke', d => d.significant ? '#000' : 'none')
    .attr('stroke-width', d => d.significant ? 1.5 : 0)
    .attr('opacity', 0.85)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', d.significant ? 10 : 6);
        tooltip.style('display', 'block')
            .html(`<strong>Position:</strong> ${d.pos.toLocaleString()}<br>
                   <strong>P-value:</strong> ${d.pvalue < 0.001 ? d.pvalue.toExponential(2) : d.pvalue.toFixed(4)}<br>
                   <strong>-log10(P):</strong> ${d.logp.toFixed(2)}<br>
                   <strong>Significant:</strong> ${d.significant ? 'Yes' : 'No'}`);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px').style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function(event, d) {
        d3.select(this).attr('r', d.significant ? 7 : 4);
        tooltip.style('display', 'none');
    });

// 连接线（从热图点到基因位置）
svg.selectAll('.connect-line')
    .data(data.filter(d => d.significant))
    .enter()
    .append('line')
    .attr('class', 'connect-line')
    .attr('x1', d => xScale(d.pos))
    .attr('y1', geneY - geneH - 8)
    .attr('x2', d => xScale(d.pos))
    .attr('y2', geneY - geneH/2 - 2)
    .attr('stroke', d => colorScale(d.logp))
    .attr('stroke-width', 1.5)
    .attr('stroke-dasharray', '3,2');

// 标题和图例
svg.append('text')
    .attr('x', 0)
    .attr('y', -25)
    .attr('font-size', '14px')
    .attr('font-weight', '600')
    .attr('fill', '#2c3e50')
    .text('P-value Distribution Across Gene Region');

// 区域标签
svg.append('text')
    .attr('x', (geneX1 + geneX2) / 2)
    .attr('y', geneY + geneH/2 + 15)
    .attr('text-anchor', 'middle')
    .attr('font-size', '11px')
    .attr('fill', '#2c3e50')
    .text('Gene Body');

if (promoterStart < promoterEnd) {
    svg.append('text')
        .attr('x', (xScale(promoterStart) + xScale(promoterEnd)) / 2)
        .attr('y', geneY + geneH/2 + 15)
        .attr('text-anchor', 'middle')
        .attr('font-size', '10px')
        .attr('fill', '#e67e22')
        .text('Promoter');
}
</script>
</body>
</html>
