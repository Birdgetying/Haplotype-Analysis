<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manhattan Plot - Region chr6H:543,444,087-543,447,148</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white;
                  padding: 20px 30px; border-radius: 10px 10px 0 0; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header-info { font-size: 13px; opacity: 0.9; }
        .plot-container { padding: 30px; }
        #manhattan { width: 100%; height: 450px; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .axis text { font-size: 11px; }
        .axis-label { font-size: 13px; font-weight: 600; }
        .threshold-line { stroke-dasharray: 5,5; }
        .legend { display: flex; gap: 20px; padding: 15px 30px; border-top: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Manhattan Plot</h1>
        <div class="header-info">Region: chr6H:543,444,087 - 543,447,148 | Variants: 28</div>
    </div>
    
    <div class="plot-container">
        <div id="manhattan"></div>
    </div>
    
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#3498db;"></div>Variants</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e74c3c;"></div>P &lt; 0.05</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8B0000;"></div>P &lt; 0.01</div>
        <div class="legend-item"><span style="color:#e74c3c;">---</span> P = 0.05</div>
        <div class="legend-item"><span style="color:#8B0000;">---</span> P = 0.01</div>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"pos": 543444288, "pvalue": 0.052406196729854644, "logp": 1.2806173571676913, "type": "variant"}, {"pos": 543445205, "pvalue": 1.0, "logp": -0.0, "type": "variant"}, {"pos": 543445244, "pvalue": 0.0186470155458887, "logp": 1.729390667108346, "type": "variant"}, {"pos": 543445382, "pvalue": 0.16943737405815337, "logp": 0.7709907878839637, "type": "variant"}, {"pos": 543445391, "pvalue": 0.293795781791148, "logp": 0.5319544439371138, "type": "variant"}, {"pos": 543445397, "pvalue": 0.025835074687243376, "logp": 1.5877902786040643, "type": "variant"}, {"pos": 543445409, "pvalue": 0.025835074687243376, "logp": 1.5877902786040643, "type": "variant"}, {"pos": 543445423, "pvalue": 0.04398209595997692, "logp": 1.356724078245745, "type": "variant"}, {"pos": 543445496, "pvalue": 0.04398209595997692, "logp": 1.356724078245745, "type": "variant"}, {"pos": 543445505, "pvalue": 0.20067735316251892, "logp": 0.6975016357412226, "type": "variant"}, {"pos": 543445562, "pvalue": 0.5899243089883129, "logp": 0.22920370750610972, "type": "variant"}, {"pos": 543445611, "pvalue": 0.026014705067367864, "logp": 1.5847810934020303, "type": "variant"}, {"pos": 543445651, "pvalue": 8.065149582174593e-09, "logp": 8.093387573456596, "type": "variant"}, {"pos": 543445654, "pvalue": 0.5899243089883129, "logp": 0.22920370750610972, "type": "variant"}, {"pos": 543445681, "pvalue": 0.5899243089883129, "logp": 0.22920370750610972, "type": "variant"}, {"pos": 543445731, "pvalue": 0.026014705067367864, "logp": 1.5847810934020303, "type": "variant"}, {"pos": 543445900, "pvalue": 0.20067735316251892, "logp": 0.6975016357412226, "type": "variant"}, {"pos": 543445911, "pvalue": 0.06962628878181126, "logp": 1.157226752957908, "type": "variant"}, {"pos": 543446091, "pvalue": 0.5965349173654861, "logp": 0.2243641304088444, "type": "variant"}, {"pos": 543446507, "pvalue": 0.7469320504170391, "logp": 0.1267189048394583, "type": "variant"}, {"pos": 543446568, "pvalue": 0.3445738054547685, "logp": 0.4627177407557997, "type": "variant"}, {"pos": 543446574, "pvalue": 0.013279983560574285, "logp": 1.876802462585192, "type": "variant"}, {"pos": 543446623, "pvalue": 0.8634982882722163, "logp": 0.06373851900522862, "type": "variant"}, {"pos": 543446640, "pvalue": 0.8634982882722163, "logp": 0.06373851900522862, "type": "variant"}, {"pos": 543446968, "pvalue": 0.8281738127872207, "logp": 0.081878506195164, "type": "variant"}, {"pos": 543447079, "pvalue": 0.4903166435949736, "logp": 0.30952336455766594, "type": "variant"}, {"pos": 543447103, "pvalue": 0.09356658608092047, "logp": 1.0288792161282583, "type": "variant"}, {"pos": 543447114, "pvalue": 0.7121338124881116, "logp": 0.14743839321014068, "type": "variant"}];
const margin = {top: 30, right: 40, bottom: 60, left: 70};
const container = document.getElementById('manhattan');
const width = container.clientWidth - margin.left - margin.right;
const height = 450 - margin.top - margin.bottom;

const svg = d3.select('#manhattan')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

// 比例尺
const xScale = d3.scaleLinear()
    .domain([543444087, 543447148])
    .range([0, width]);

const maxLogP = data.length > 0 ? Math.max(...data.map(d => d.logp)) * 1.1 : 5;
const yScale = d3.scaleLinear()
    .domain([0, Math.max(maxLogP, 3)])
    .range([height, 0]);

// 坐标轴
svg.append('g')
    .attr('transform', `translate(0,${height})`)
    .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => (d/1000000).toFixed(2) + 'M'));

svg.append('g')
    .call(d3.axisLeft(yScale));

// 坐标轴标签
svg.append('text')
    .attr('class', 'axis-label')
    .attr('x', width / 2)
    .attr('y', height + 45)
    .attr('text-anchor', 'middle')
    .text('Position (Mb)');

svg.append('text')
    .attr('class', 'axis-label')
    .attr('transform', 'rotate(-90)')
    .attr('x', -height / 2)
    .attr('y', -50)
    .attr('text-anchor', 'middle')
    .text('-log10(P-value)');

// 阈值线
const thresholds = [
    {value: -Math.log10(0.05), color: '#e74c3c', label: 'P=0.05'},
    {value: -Math.log10(0.01), color: '#8B0000', label: 'P=0.01'}
];

thresholds.forEach(t => {
    if (t.value <= maxLogP) {
        svg.append('line')
            .attr('class', 'threshold-line')
            .attr('x1', 0)
            .attr('x2', width)
            .attr('y1', yScale(t.value))
            .attr('y2', yScale(t.value))
            .attr('stroke', t.color)
            .attr('stroke-width', 1.5);
    }
});

// 绘制点
const tooltip = d3.select('#tooltip');

svg.selectAll('circle')
    .data(data)
    .enter()
    .append('circle')
    .attr('cx', d => xScale(d.pos))
    .attr('cy', d => yScale(d.logp))
    .attr('r', 5)
    .attr('fill', d => {
        if (d.pvalue < 0.01) return '#8B0000';
        if (d.pvalue < 0.05) return '#e74c3c';
        return '#3498db';
    })
    .attr('opacity', 0.7)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', 8).attr('opacity', 1);
        tooltip.style('display', 'block')
            .html(`<strong>Position:</strong> ${d.pos.toLocaleString()}<br>
                   <strong>P-value:</strong> ${d.pvalue.toExponential(2)}<br>
                   <strong>-log10(P):</strong> ${d.logp.toFixed(2)}`);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px')
               .style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function() {
        d3.select(this).attr('r', 5).attr('opacity', 0.7);
        tooltip.style('display', 'none');
    });
</script>
</body>
</html>
