<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manhattan Plot - Region chr4H:146,936,826-146,943,753</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white;
                  padding: 20px 30px; border-radius: 10px 10px 0 0; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header-info { font-size: 13px; opacity: 0.9; }
        .plot-container { padding: 30px; }
        #manhattan { width: 100%; height: 450px; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.85); color: white; padding: 12px;
                   border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; }
        .axis text { font-size: 11px; }
        .axis-label { font-size: 13px; font-weight: 600; }
        .threshold-line { stroke-dasharray: 5,5; }
        .legend { display: flex; gap: 20px; padding: 15px 30px; border-top: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Manhattan Plot</h1>
        <div class="header-info">Region: chr4H:146,936,826 - 146,943,753 | Variants: 41</div>
    </div>
    
    <div class="plot-container">
        <div id="manhattan"></div>
    </div>
    
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#3498db;"></div>Variants</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e74c3c;"></div>P &lt; 0.05</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8B0000;"></div>P &lt; 0.01</div>
        <div class="legend-item"><span style="color:#e74c3c;">---</span> P = 0.05</div>
        <div class="legend-item"><span style="color:#8B0000;">---</span> P = 0.01</div>
    </div>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const data = [{"pos": 146936898, "pvalue": 1.6806058565152223e-06, "logp": 5.7745341273762625, "type": "variant"}, {"pos": 146936918, "pvalue": 0.07102550607008859, "logp": 1.1485856631641405, "type": "variant"}, {"pos": 146937025, "pvalue": 0.0003387533754769206, "logp": 3.47011636860847, "type": "variant"}, {"pos": 146937034, "pvalue": 0.09361336118516626, "logp": 1.028662161145778, "type": "variant"}, {"pos": 146937108, "pvalue": 0.0173270441588697, "logp": 1.7612755177812054, "type": "variant"}, {"pos": 146937113, "pvalue": 0.00016738623913530205, "logp": 3.7762802483335176, "type": "variant"}, {"pos": 146937138, "pvalue": 0.653661265784064, "logp": 0.184647249399459, "type": "variant"}, {"pos": 146937327, "pvalue": 0.042442674142244646, "logp": 1.3721972607595416, "type": "variant"}, {"pos": 146937332, "pvalue": 0.0173270441588697, "logp": 1.7612755177812054, "type": "variant"}, {"pos": 146937386, "pvalue": 2.095469063699984e-12, "logp": 11.678718746456749, "type": "variant"}, {"pos": 146937620, "pvalue": 2.095469063699984e-12, "logp": 11.678718746456749, "type": "variant"}, {"pos": 146937683, "pvalue": 0.003742488665595188, "logp": 2.426839506276004, "type": "variant"}, {"pos": 146937723, "pvalue": 0.0173270441588697, "logp": 1.7612755177812054, "type": "variant"}, {"pos": 146937752, "pvalue": 0.09361336118516626, "logp": 1.028662161145778, "type": "variant"}, {"pos": 146937780, "pvalue": 0.0173270441588697, "logp": 1.7612755177812054, "type": "variant"}, {"pos": 146937850, "pvalue": 2.6314514469804295e-05, "logp": 4.579804638758241, "type": "variant"}, {"pos": 146937878, "pvalue": 3.0296640721367934e-11, "logp": 10.518605523215586, "type": "variant"}, {"pos": 146937930, "pvalue": 0.06286364819987947, "logp": 1.2016004189420202, "type": "variant"}, {"pos": 146937954, "pvalue": 0.042320206738162384, "logp": 1.3734522193985839, "type": "variant"}, {"pos": 146938113, "pvalue": 0.0003218711038936476, "logp": 3.4923180105241878, "type": "variant"}, {"pos": 146938191, "pvalue": 0.6534686146526177, "logp": 0.18477526624794144, "type": "variant"}, {"pos": 146938212, "pvalue": 0.09361336118516626, "logp": 1.028662161145778, "type": "variant"}, {"pos": 146938282, "pvalue": 0.00565056802348893, "logp": 2.2479078925226523, "type": "variant"}, {"pos": 146938474, "pvalue": 0.006538662248979237, "logp": 2.1845110953017004, "type": "variant"}, {"pos": 146938541, "pvalue": 0.006538662248979237, "logp": 2.1845110953017004, "type": "variant"}, {"pos": 146938615, "pvalue": 3.3503952338564023e-12, "logp": 11.474903957811465, "type": "variant"}, {"pos": 146938769, "pvalue": 0.013060779249646489, "logp": 1.884030910830811, "type": "variant"}, {"pos": 146939659, "pvalue": 0.09361336118516626, "logp": 1.028662161145778, "type": "variant"}, {"pos": 146939682, "pvalue": 0.09361336118516626, "logp": 1.028662161145778, "type": "variant"}, {"pos": 146940304, "pvalue": 0.0012782106457759012, "logp": 2.893397569683351, "type": "variant"}, {"pos": 146940603, "pvalue": 0.023434148088611346, "logp": 1.6301508299457812, "type": "variant"}, {"pos": 146941368, "pvalue": 0.013060779249646489, "logp": 1.884030910830811, "type": "variant"}, {"pos": 146941906, "pvalue": 0.011031558304328382, "logp": 1.957363135323242, "type": "variant"}, {"pos": 146941938, "pvalue": 4.54639345300597e-11, "logp": 10.342332982364837, "type": "variant"}, {"pos": 146942985, "pvalue": 0.06286364819987947, "logp": 1.2016004189420202, "type": "variant"}, {"pos": 146942988, "pvalue": 0.06286364819987947, "logp": 1.2016004189420202, "type": "variant"}, {"pos": 146942994, "pvalue": 0.06286364819987947, "logp": 1.2016004189420202, "type": "variant"}, {"pos": 146943093, "pvalue": 3.2245568670571127e-11, "logp": 10.491529959606984, "type": "variant"}, {"pos": 146943428, "pvalue": 0.00028198468091665015, "logp": 3.54977448449652, "type": "variant"}, {"pos": 146943510, "pvalue": 0.6768013976000729, "logp": 0.16953875314667347, "type": "variant"}, {"pos": 146943635, "pvalue": 2.095469063699984e-12, "logp": 11.678718746456749, "type": "variant"}];
const margin = {top: 30, right: 40, bottom: 60, left: 70};
const container = document.getElementById('manhattan');
const width = container.clientWidth - margin.left - margin.right;
const height = 450 - margin.top - margin.bottom;

const svg = d3.select('#manhattan')
    .append('svg')
    .attr('width', width + margin.left + margin.right)
    .attr('height', height + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

// 比例尺
const xScale = d3.scaleLinear()
    .domain([146936826, 146943753])
    .range([0, width]);

const maxLogP = data.length > 0 ? Math.max(...data.map(d => d.logp)) * 1.1 : 5;
const yScale = d3.scaleLinear()
    .domain([0, Math.max(maxLogP, 3)])
    .range([height, 0]);

// 坐标轴
svg.append('g')
    .attr('transform', `translate(0,${height})`)
    .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => (d/1000000).toFixed(2) + 'M'));

svg.append('g')
    .call(d3.axisLeft(yScale));

// 坐标轴标签
svg.append('text')
    .attr('class', 'axis-label')
    .attr('x', width / 2)
    .attr('y', height + 45)
    .attr('text-anchor', 'middle')
    .text('Position (Mb)');

svg.append('text')
    .attr('class', 'axis-label')
    .attr('transform', 'rotate(-90)')
    .attr('x', -height / 2)
    .attr('y', -50)
    .attr('text-anchor', 'middle')
    .text('-log10(P-value)');

// 阈值线
const thresholds = [
    {value: -Math.log10(0.05), color: '#e74c3c', label: 'P=0.05'},
    {value: -Math.log10(0.01), color: '#8B0000', label: 'P=0.01'}
];

thresholds.forEach(t => {
    if (t.value <= maxLogP) {
        svg.append('line')
            .attr('class', 'threshold-line')
            .attr('x1', 0)
            .attr('x2', width)
            .attr('y1', yScale(t.value))
            .attr('y2', yScale(t.value))
            .attr('stroke', t.color)
            .attr('stroke-width', 1.5);
    }
});

// 绘制点
const tooltip = d3.select('#tooltip');

svg.selectAll('circle')
    .data(data)
    .enter()
    .append('circle')
    .attr('cx', d => xScale(d.pos))
    .attr('cy', d => yScale(d.logp))
    .attr('r', 5)
    .attr('fill', d => {
        if (d.pvalue < 0.01) return '#8B0000';
        if (d.pvalue < 0.05) return '#e74c3c';
        return '#3498db';
    })
    .attr('opacity', 0.7)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
        d3.select(this).attr('r', 8).attr('opacity', 1);
        tooltip.style('display', 'block')
            .html(`<strong>Position:</strong> ${d.pos.toLocaleString()}<br>
                   <strong>P-value:</strong> ${d.pvalue.toExponential(2)}<br>
                   <strong>-log10(P):</strong> ${d.logp.toFixed(2)}`);
    })
    .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 15) + 'px')
               .style('top', (event.pageY - 10) + 'px');
    })
    .on('mouseout', function() {
        d3.select(this).attr('r', 5).attr('opacity', 0.7);
        tooltip.style('display', 'none');
    });
</script>
</body>
</html>
